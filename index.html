<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PronosLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#07090d}.glass{background:rgba(16,20,28,.82);border:1px solid #1c2433}</style>
</head>
<body class="text-slate-300 font-sans">
<header class="border-b border-slate-800"><div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
<p class="text-white font-bold">PRONOSLAB</p>
<nav class="text-xs flex gap-3"><a href="#picks">Picks</a><a href="#live">En vivo</a></nav>
</div></header>
<main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
<h1 class="text-4xl text-white font-bold">PRONÓSTICOS Y VALOR</h1>
<form id="f" class="glass rounded-2xl p-4 flex flex-wrap gap-3 items-end">
<label class="text-xs">API<br><input id="base" class="bg-black/40 rounded px-2 py-1 w-56" placeholder="https://tu-worker.workers.dev"/></label>
<label class="text-xs">Fecha<br><input id="date" type="date" value="2026-09-16" class="bg-black/40 rounded px-2 py-1"/></label>
<label class="text-xs">Liga<br><select id="league" class="bg-black/40 rounded px-2 py-1"><option value="2">UCL</option><option value="39">Premier</option></select></label>
<label class="text-xs">min edge<br><input id="edge" value="0.04" class="bg-black/40 rounded px-2 py-1 w-16"/></label>
<button class="bg-emerald-500 text-black rounded px-4 py-2 font-semibold">Cargar</button>
</form>
<p id="status" class="text-sm text-slate-400"></p>
<div id="list" class="space-y-3"></div>
<section id="live"><h2 class="text-2xl text-white mb-2">EN VIVO</h2>
<p class="text-xs text-slate-500 mb-2">API-Football live=all · cada 20s</p>
<div id="livebox" class="text-sm text-slate-400">Pega la URL del Worker/API</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const origin=()=>($('base').value||'').replace(/\/$/,'');
async function load(e){e&&e.preventDefault();
const base=origin(); if(!base){$('status').textContent='Pega API (Worker) para picks y live.';return;}
const q=new URLSearchParams({date:$('date').value,league:$('league').value,season:'2026',min_edge:$('edge').value});
try{const d=await(await fetch(base+'/api/picks?'+q)).json();
const picks=d.picks||[]; $('status').textContent=(d.source||'')+' · '+picks.length+' valor';
$('list').innerHTML=picks.map(p=>'<article class="glass rounded-xl p-4"><p class="text-white font-semibold">'+p.home+' — '+p.away+'</p>'+(p.value_bets||[]).map(v=>'<p class="text-emerald-400 text-sm">'+v.market+' '+v.pick+' @ '+v.odd+' edge '+(v.edge*100).toFixed(1)+'pp</p>').join('')+'</article>').join('')||'Sin value';}
catch(err){$('status').textContent=err.message;}}
async function live(){const base=origin(); if(!base)return;
try{const d=await(await fetch(base+'/api/live')).json(); const rows=d.matches||[];
$('livebox').innerHTML=rows.length?rows.map(m=>'<article class="glass rounded-xl p-3"><span class="text-xs text-slate-500">'+m.league+' '+m.status+' '+ (m.elapsed||'')+'\'</span> <b class="text-white">'+m.home+' '+(m.goals_home??'-')+'–'+(m.goals_away??'-')+' '+m.away+'</b></article>').join(''):'Nadie en juego';}
catch(e){$('livebox').textContent='Live off';}}
$('f').onsubmit=load; load(); live(); setInterval(live,20000);
</script></body></html>
